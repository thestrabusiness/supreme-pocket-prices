<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<body>
<title>Supreme × Analogue Pocket — Market Tracker</title>
<style>
  :root{
    --red:#E01B22; --red-deep:#8E1015;
    --stock:#F4F2ED; --stock-sink:#E9E5DC;
    --ink:#14110F; --ink-soft:#6B6560; --rule:#D8D4CC;
    --gain:#0F7B4F; --loss:#A8121A; --gold:#9C7112;
    --display:'Archivo Black','Arial Black',Impact,'Helvetica Neue',sans-serif;
    --body:'Helvetica Neue',Helvetica,Arial,sans-serif;
    --data:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --gap:26px; --chart-h:184px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--red);
    background-image:
      radial-gradient(ellipse at 18% -5%, rgba(255,255,255,.11), transparent 55%),
      radial-gradient(ellipse at 92% 105%, rgba(0,0,0,.22), transparent 52%);
    background-attachment:fixed;
    font-family:var(--body); color:var(--ink);
    -webkit-font-smoothing:antialiased;
    padding:26px 15px 60px;
  }
  .stack{max-width:660px;margin:0 auto;display:flex;flex-direction:column;gap:18px;}
  @media (min-width:900px){ .stack{max-width:980px;} }
  /* Desktop is a 12-column board. Every card spans the full row unless it
     carries a width class; w7/w5 pairs are used for the two rows that sit side
     by side, and always in that order so the column seam lines up. */
  @media (min-width:1100px){
    body{padding:22px 24px 48px;}
    .stack{max-width:1440px;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;}
    .stack > *{grid-column:1 / -1;}
    .stack > .w7{grid-column:span 7;}
    .stack > .w5{grid-column:span 5;}
    :root{--chart-h:250px;}
  }

  .label{
    background:var(--stock); border-radius:10px; padding:20px;
    box-shadow:0 1px 0 rgba(255,255,255,.4) inset, 0 7px 20px rgba(0,0,0,.26);
    position:relative;
    /* Each card decides its own inner layout from its own width, not the
       viewport's: a 5-column card and a full-width card share the same CSS
       but need different answers. */
    container-type:inline-size; container-name:card;
  }
  .label::after{content:"";position:absolute;inset:0;border-radius:10px;
    box-shadow:0 0 0 1px rgba(0,0,0,.07) inset;pointer-events:none;}

  /* Two-up layout. In a narrow card every pair stacks and separates with a
     rule; in a wide one, columns sit side by side divided by the same rule
     turned vertical. data-cols carries how many children there actually are,
     so a single-colorway filter reflows to full width instead of leaving a gap. */
  .pair{display:grid;gap:18px;}
  .pair > * + *{border-top:1px solid var(--rule);padding-top:18px;}
  @container card (min-width:620px){
    /* The divider is padded from both sides rather than indenting only the
       second column, so the two content boxes come out the same width — side
       by side charts otherwise render at visibly different scales. */
    .pair[data-cols="2"]{grid-template-columns:1fr 1fr;column-gap:0;}
    .pair[data-cols="2"] > :first-child{padding-right:var(--gap);}
    .pair[data-cols="2"] > * + *{
      border-top:0;padding-top:0;
      border-left:1px solid var(--rule);padding-left:var(--gap);}
  }

  /* Masthead: identity on one side, the controls on the other. Narrow, they
     stack under a rule; wide, the rule turns vertical between them. */
  .masthead{display:grid;gap:18px;}
  .masthead > * + *{border-top:1px solid var(--rule);padding-top:18px;}
  @media (min-width:1100px){
    .masthead{grid-template-columns:minmax(0,1fr) auto;column-gap:0;align-items:center;}
    .masthead > :first-child{padding-right:36px;}
    .masthead > * + *{border-top:0;padding-top:0;
      border-left:1px solid var(--rule);padding-left:36px;}
    .brandline{font-size:30px;margin-bottom:12px;}
    .barcode{height:26px;margin-bottom:10px;}
    .controls .note{max-width:56ch;}
  }
  .health{margin:9px 0 0;font-size:12px;color:var(--ink-soft);line-height:1.55;}
  .health summary{cursor:pointer;font-family:var(--data);font-size:11px;letter-spacing:.03em;
    color:var(--loss);}
  .health p{margin:6px 0 0;}

  .brandline{
    font-family:var(--display);
    font-size:clamp(25px,6.8vw,36px); line-height:.95; letter-spacing:-.02em;
    text-transform:uppercase; transform:skewX(-9deg); transform-origin:left bottom;
    margin:0 0 14px; text-wrap:balance;
  }
  .brandline em{font-style:normal;color:var(--red);}

  .barcode{height:38px;width:100%;margin:0 0 11px;background-repeat:repeat-x;
    background-size:66px 100%;
    background-image:repeating-linear-gradient(90deg,
      var(--ink) 0 2px, transparent 2px 5px, var(--ink) 5px 6px, transparent 6px 10px,
      var(--ink) 10px 13px, transparent 13px 14px, var(--ink) 14px 15px, transparent 15px 19px,
      var(--ink) 19px 22px, transparent 22px 25px, var(--ink) 25px 26px, transparent 26px 30px,
      var(--ink) 30px 33px, transparent 33px 34px, var(--ink) 34px 36px, transparent 36px 40px,
      var(--ink) 40px 41px, transparent 41px 45px, var(--ink) 45px 48px, transparent 48px 50px,
      var(--ink) 50px 51px, transparent 51px 55px, var(--ink) 55px 58px, transparent 58px 59px,
      var(--ink) 59px 61px, transparent 61px 66px);}

  .meta{font-family:var(--data);font-size:11px;letter-spacing:.03em;color:var(--ink-soft);
    display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .meta strong{color:var(--ink);font-weight:700;}
  .meta .ok{color:var(--gain);} .meta .bad{color:var(--loss);}

  .cardhead{font-family:var(--data);font-size:10px;font-weight:400;text-transform:uppercase;
    letter-spacing:.12em;color:var(--ink-soft);margin:0 0 10px;}
  .subhead{font-family:var(--data);font-size:10px;font-weight:400;text-transform:uppercase;
    letter-spacing:.1em;color:var(--ink-soft);margin:0 0 4px;}

  /* filter */
  .filterbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .filterbar + .filterbar{margin-top:11px;}
  .filterbar h3{font-family:var(--data);font-size:10px;font-weight:400;
    text-transform:uppercase;letter-spacing:.13em;color:var(--ink-soft);margin:0;
    min-width:96px;}
  .seg{display:flex;border:1px solid var(--rule);border-radius:7px;overflow:hidden;}
  .seg button{
    appearance:none;border:0;background:transparent;cursor:pointer;
    font-family:var(--data);font-size:11px;letter-spacing:.04em;
    padding:8px 13px;color:var(--ink-soft);
    border-right:1px solid var(--rule);transition:background .13s,color .13s;
  }
  .seg button:last-child{border-right:0;}
  .seg button:hover{background:var(--stock-sink);color:var(--ink);}
  .seg button[aria-pressed="true"]{background:var(--red);color:#fff;font-weight:700;}
  .seg button:focus-visible{outline:2px solid var(--ink);outline-offset:-2px;}

  .note{font-size:12px;color:var(--ink-soft);margin:9px 0 0;line-height:1.55;max-width:72ch;}
  .note b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;}
  .note.foot{margin-top:15px;border-top:1px solid var(--rule);padding-top:12px;font-size:11.5px;}

  /* colorway identity */
  .swatch{width:14px;height:14px;border-radius:3px;flex:none;
    box-shadow:0 0 0 1px rgba(0,0,0,.2) inset;}
  .swatch.red{background:#D1191F;}
  .swatch.gold{background:linear-gradient(135deg,#E8C25A,#B8860B);}

  /* verdict */
  .vgrid{display:grid;gap:14px;}
  @container card (min-width:620px){ .vgrid[data-cols="2"]{grid-template-columns:1fr 1fr;gap:18px;} }
  .vblock{background:var(--stock-sink);border-radius:7px;padding:13px 15px;
    border-left:3px solid var(--ink-soft);}
  .vblock.red{border-left-color:#D1191F;}
  .vblock.gold{border-left-color:#B8860B;}
  .vhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    font-family:var(--data);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--ink-soft);margin:0 0 7px;}
  .vhead b{color:var(--ink);font-weight:700;}
  .vmain{font-family:var(--data);font-size:clamp(17px,3.4vw,21px);font-weight:700;
    font-variant-numeric:tabular-nums;line-height:1.2;}
  .vmeta{font-size:12px;color:var(--ink-soft);line-height:1.55;margin:7px 0 0;}
  .vmeta b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;}
  .vnote{font-size:11.5px;color:var(--ink-soft);line-height:1.55;margin:9px 0 0;
    border-top:1px dashed var(--rule);padding-top:9px;}
  .vnote b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;}

  .plan tr.pick td{background:var(--stock-sink);font-weight:700;}
  .plan .qpos{font-size:10px;display:block;}
  /* The plan's middle column carries a two-line answer, so it needs more room
     than the reference table's price column gives it. */
  col.c-ask{width:22%;} col.c-sell{width:50%;} col.c-profit{width:28%;}

  /* Latest listings: one line per row, title truncates, the swatch carries
     the colorway so the title column never has to spell it out. */
  col.c-title{width:58%;} col.c-lprice{width:24%;} col.c-seen{width:18%;}
  .listings td:first-child{font-family:var(--body);font-weight:400;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .listings td:first-child .swatch{display:inline-block;vertical-align:-2px;margin-right:8px;}
  .listings a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--rule);}
  .listings a:hover{border-bottom-color:var(--ink);}

  .tablewrap{overflow-x:auto;}
  /* Fixed layout so every table on the page shares one column grid. Left to
     auto-size, each sizes to its own labels and the price columns drift out of
     alignment between venues and between colorways. */
  table{width:100%;border-collapse:collapse;table-layout:fixed;}
  col.c-metric{width:38%;}
  col.c-price{width:31%;}
  col.c-delta{width:31%;}
  table + table{margin-top:22px;}
  thead th:first-child{color:var(--ink);font-weight:700;}
  th{font-family:var(--data);font-size:10px;font-weight:400;text-transform:uppercase;
    letter-spacing:.1em;color:var(--ink-soft);text-align:right;padding:0 0 6px;
    border-bottom:1px solid var(--rule);white-space:nowrap;}
  th:first-child{text-align:left;}
  th.th-red{color:#B0151A;font-weight:700;}
  th.th-gold{color:var(--gold);font-weight:700;}
  td{padding:9px 0;border-bottom:1px solid var(--rule);font-family:var(--data);
    font-size:13px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
  td:first-child{text-align:left;font-family:var(--body);font-size:13px;font-weight:600;
    white-space:normal;}
  tr:last-child td{border-bottom:none;}
  .up{color:var(--gain);font-weight:700;}
  .down{color:var(--loss);font-weight:700;}
  .muted{color:var(--ink-soft);}
  /* Declared after .up/.down/.muted so a suffix keeps their colour at body
     weight instead of shouting alongside the figure it annotates. Narrow
     screens stack it under the figure: a value and its suffix side by side
     ("18%  $598-$1,076") overflow a phone-width colorway column. */
  .sub{display:block;font-size:10.5px;font-weight:400;letter-spacing:.02em;}
  @container card (min-width:480px){ .sub{display:inline;margin-left:4px;} }
  .pill{display:inline-block;font-family:var(--data);font-size:9px;
    text-transform:uppercase;letter-spacing:.08em;padding:2px 6px;border-radius:3px;
    background:var(--stock-sink);color:var(--ink-soft);margin-left:6px;vertical-align:1px;}
  .pill.presale{background:rgba(156,113,18,.15);color:var(--gold);}

  canvas{width:100%;height:var(--chart-h);display:block;margin:4px 0 0;touch-action:pan-y;}
  .chartwrap{position:relative;}
  /* Tooltip: values lead, the series name follows, a short stroke keys the
     colorway. Never receives the pointer, so it can sit over the plot. */
  .tip{position:absolute;z-index:2;pointer-events:none;
    background:var(--ink);color:var(--stock);border-radius:6px;padding:7px 10px;
    font-family:var(--data);font-size:11px;line-height:1.45;white-space:nowrap;
    box-shadow:0 4px 14px rgba(0,0,0,.28);max-width:calc(100% - 8px);}
  .tip-h{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
    color:rgba(244,242,237,.62);margin:0 0 3px;}
  .tip-r{display:flex;align-items:center;gap:7px;}
  .tip-r i{width:12px;border-top:2px solid;flex:none;}
  .tip-r b{font-weight:700;font-variant-numeric:tabular-nums;}
  .tip-r span{color:rgba(244,242,237,.7);}
  .tip-t{margin:4px 0 0;font-family:var(--body);font-size:11px;white-space:normal;
    max-width:220px;color:rgba(244,242,237,.75);}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--data);font-size:10px;
    color:var(--ink-soft);letter-spacing:.04em;margin:9px 0 0;}
  .legend span{display:flex;align-items:center;gap:5px;}
  .legend span[hidden]{display:none;}
  .dot{width:8px;height:8px;border-radius:50%;}

  .comps{list-style:none;margin:0;padding:0;}
  /* One line per comp, always. Rows of one height fill the columns evenly and
     stop a title wrapping partway across a column break; the full title is on
     hover and behind the link. */
  .comps li{display:flex;justify-content:space-between;gap:12px;align-items:baseline;
    padding:8px 0;border-bottom:1px solid var(--rule);font-size:13px;}
  .comps .ctitle{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .comps .cmeta{flex:none;white-space:nowrap;}
  @container card (min-width:620px){
    .comps{columns:2;column-gap:var(--gap);}
    .comps li{break-inside:avoid;}
  }
  @container card (min-width:1000px){ .comps{columns:3;} }
  .comps a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--rule);}
  .comps a:hover{border-bottom-color:var(--ink);}
  .comps .cprice{font-family:var(--data);font-weight:700;font-variant-numeric:tabular-nums;
    white-space:nowrap;}
  .comps .cdate{font-family:var(--data);font-size:10px;color:var(--ink-soft);
    white-space:nowrap;}

  .footline{font-family:var(--data);font-size:10px;letter-spacing:.05em;
    color:rgba(255,255,255,.75);text-align:center;line-height:1.75;padding:2px 8px 0;}

  @media (prefers-reduced-motion:no-preference){
    .label{animation:settle .45s cubic-bezier(.2,.8,.3,1) backwards;}
    .label:nth-child(2){animation-delay:.05s;} .label:nth-child(3){animation-delay:.1s;}
    .label:nth-child(4){animation-delay:.15s;} .label:nth-child(5){animation-delay:.2s;}
    .label:nth-child(6){animation-delay:.25s;}
    @keyframes settle{from{opacity:0;transform:translateY(8px);}}
  }
</style>

let FILTER = "all";
// Which colorway to show. Both units are held, so the merged view is the
// default; the filter is for when only one of them is being sold.
let COLORWAY = "both";
// How long you are willing to wait, in days. Price is really a choice about
// speed, so this is the one input that decides what the plan recommends.
let HORIZON = 14;
// Whether StockX sales to buyers abroad count. Their shown price includes
// import duty the seller never receives, so they are out by default.
let XREGION = "domestic";

const $ = (h) => { const t = document.createElement("template");
  t.innerHTML = h.trim(); return t.content.firstElementChild; };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const usd = (n) => n == null ? "—" : "$" + Math.round(n).toLocaleString("en-US");
// Profit reads as a change, so it always carries its sign.
const signed = (n) => n == null ? "—" : (n < 0 ? "−" : "+") + usd(Math.abs(n));
const stroke = (key) => key === "red" ? "#D1191F" : "#B8860B";

function activeTargets(){
  return DATA.targets.filter(t => COLORWAY === "both" || t.key === COLORWAY);
}

function median(xs){
  if(!xs.length) return null;
  const s = [...xs].sort((a,b)=>a-b), m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m-1] + s[m]) / 2;
}
function pctOver(price, retail){
  if(price == null) return "—";
  const p = Math.round((price / retail - 1) * 100);
  return (p >= 0 ? "+" : "") + p + "%";
}
function cls(price, retail){
  if(price == null) return "muted";
  return price >= retail ? "up" : "down";
}
function rows(key, kind){
  return DATA.ebay[key].filter(r =>
    r.kind === kind && (FILTER === "all" || r.tag === FILTER));
}
function latestStockx(key){
  const s = DATA.stockx[key];
  return s.length ? s[s.length - 1] : {};
}

function quantile(xs, p){
  if(!xs.length) return null;
  const s = [...xs].sort((a, b) => a - b), i = (s.length - 1) * p;
  const lo = Math.floor(i), hi = Math.min(lo + 1, s.length - 1);
  return s[lo] + (s[hi] - s[lo]) * (i - lo);
}

// Both venues are priced the same way: list at what units actually clear at and
// wait. Neither an instant sale into the highest bid nor matching the lowest ask
// reflects how these will really be sold.
function venueFor(name, sales, fee, cost){
  if(!sales.length) return null;
  const after = (p) => p * (1 - fee) - cost;
  const low = quantile(sales, .25), mid = quantile(sales, .5), high = quantile(sales, .75);
  return {name, n: sales.length, low, mid, high,
          profitLow: after(low), profitMid: after(mid), profitHigh: after(high)};
}

// StockX uses all-in pricing: when the buyer sits in another region, import
// duties and taxes are folded into the figure shown in View All Sales, while the
// seller is still paid only their own ask. Those sales display roughly 35-45%
// high and land in a separate cluster with an empty band beneath it, so they are
// split off rather than averaged into anything we quote as a payout.
// https://stockx.com/help/articles/why-did-an-item-sell-for-higher-than-my-asking-price
function splitCrossRegion(sales){
  const s = [...sales].sort((a, b) => a - b);
  const none = {domestic: s, foreign: []};
  if(s.length < 12) return none;
  const mid = quantile(s, .5);
  let at = -1, widest = 0;
  for(let i = 0; i < s.length - 1; i++){
    if(s[i] < mid) continue;
    if(s[i + 1] - s[i] > widest){ widest = s[i + 1] - s[i]; at = i + 1; }
  }
  // A real price distribution tapers; a hole this wide is the duty step.
  if(at < 0 || widest < mid * 0.15) return none;
  return {domestic: s.slice(0, at), foreign: s.slice(at), gap: widest};
}

// StockX labels each sale with what the seller was paid (Seller View), so a
// cross-region sale, the buyer's price with import duty folded in, is simply
// one where the two figures disagree. Sales older than the drawer's 50-row
// window were recorded before that label was read; for those few, the duty
// step is inferred from the gap the rest of the sales leave.
function crossRegion(sales){
  const guess = splitCrossRegion(sales.map(r => r.price));
  const cut = guess.foreign.length ? guess.foreign[0] : Infinity;
  const isForeign = r => r.cross_region ?? r.price >= cut;
  const rows = sales.filter(r => !isForeign(r));
  return {
    rows,
    domestic: rows.map(r => r.price).sort((a, b) => a - b),
    foreign: sales.filter(isForeign).sort((a, b) => a.price - b.price),
  };
}

// The StockX sales that count under the current filter, oldest first.
function stockxPool(key){
  const sales = DATA.stockx_sales[key] || [];
  return XREGION === "all" ? sales : crossRegion(sales).rows;
}

function verdictFor(t){
  const cost = t.cost ?? t.retail;
  // A drop this young is thick with speculators, so one median is false
  // precision. The middle half of realised sales is the honest claim.
  const split = crossRegion(DATA.stockx_sales[t.key]);
  const pool = XREGION === "all"
    ? [...split.domestic, ...split.foreign.map(r => r.price)].sort((a, b) => a - b)
    : split.domestic;
  const venues = [
    venueFor("StockX", pool, DATA.fees.stockx, cost),
    venueFor("eBay", rows(t.key, "sale").map(r => r.price), DATA.fees.ebay, cost),
  ].filter(Boolean).sort((a, b) => b.profitMid - a.profitMid);
  return {sx: latestStockx(t.key), cost, split,
          best: venues[0] ?? null, other: venues[1] ?? null};
}

function sellPlan(t){
  const cost = t.cost ?? t.retail, fee = DATA.fees.ebay;
  const inhand = DATA.ebay[t.key]
    .filter(r => r.kind === "ask" && r.tag === "in_hand")
    .map(r => r.price).sort((a, b) => a - b);
  // Rate off the last three days with sales, not the whole run: the drop-week
  // clip is long gone and averaging it in would flatter every estimate.
  const sold = DATA.ebay[t.key].filter(r => r.kind === "sale").map(r => r.price);
  const byDay = {};
  DATA.ebay[t.key].filter(r => r.kind === "sale" && r.date)
    .forEach(r => { byDay[r.date] = (byDay[r.date] || 0) + 1; });
  const dayKeys = Object.keys(byDay).sort();
  const mean = (ks) => ks.reduce((s, d) => s + byDay[d], 0) / ks.length;
  const rate = dayKeys.length ? mean(dayKeys.slice(-3)) : 0;
  const opening = dayKeys.length >= 6 ? mean(dayKeys.slice(0, 3)) : null;
  const decay = opening ? rate / opening - 1 : null;
  if(!inhand.length || !sold.length || !rate) return null;

  const STEP = 25;
  const lo = Math.floor(quantile(sold, .05) / STEP) * STEP;
  const hi = Math.ceil(quantile(sold, .90) / STEP) * STEP;
  // Five rungs span the same range as seven and read in one glance.
  const stride = Math.max(STEP, Math.round((hi - lo) / 4 / STEP) * STEP);
  const rows = [];
  for(let p = lo; p <= hi + 1; p += stride){
    // Counting only the listings below you says nothing about whether anyone
    // pays that much. The shape of past sales is the demand curve: scale the
    // current clip by the share of buyers who went at least this high.
    const share = sold.filter(s => s >= p).length / sold.length;
    const arrivals = rate * share;
    // You are one of the listings at or under this price chasing those buyers.
    const competing = inhand.filter(a => a <= p).length + 1;
    rows.push({price: p, competing, share, profit: p * (1 - fee) - cost,
               days: arrivals > 0 ? competing / arrivals : Infinity});
  }
  let pick = null;
  rows.forEach(r => { if(r.days <= HORIZON && (!pick || r.profit > pick.profit)) pick = r; });
  return {rows, rate, decay, listed: inhand.length, pick};
}

function verdictCard(tgts){
  const blocks = tgts.map(t => {
    const v = verdictFor(t), b = v.best, o = v.other;
    const head = `<div class="vhead"><span class="swatch ${t.key}"></span>
      <b>${esc(t.label)}</b><span>retail $${t.retail} · paid ${usd(v.cost)}</span></div>`;
    if(!b) return `<div class="vblock ${t.key}">${head}
      <div class="vmain muted">not enough data yet</div></div>`;
    const xr = v.split.foreign, dom = v.split.domestic;
    const paid = xr.map(r => r.seller_price).filter(p => p != null);
    return `<div class="vblock ${t.key}">${head}
      <div class="vmain ${b.profitMid >= 0 ? "up" : "down"}">${signed(b.profitLow)} to
        ${signed(b.profitHigh)}</div>
      <p class="vmeta">via <b>${esc(b.name)}</b>, midpoint <b>${signed(b.profitMid)}</b>.
        The middle half of ${b.n} sales cleared <b>${usd(b.low)}–${usd(b.high)}</b>.${
        o ? ` The same half on ${esc(o.name)} returns ${signed(o.profitLow)} to
        ${signed(o.profitHigh)}.` : ""}</p>
      ${xr.length ? `<p class="vnote"><b>${xr.length} of ${xr.length + dom.length}</b> StockX
        sales went to cross-region buyers, shown at <b>${usd(xr[0].price)}–${
        usd(xr[xr.length - 1].price)}</b> with import duty folded in${paid.length
        ? `, while the seller was paid <b>${usd(Math.min(...paid))}–${usd(Math.max(...paid))}</b>`
        : ""}. ${XREGION === "all" ? "They are counted above." : "They are left out."}</p>` : ""}
    </div>`;
  }).join("");
  return $(`<section class="label">
    <h3 class="cardhead">Likely profit — after fees and cost</h3>
    <div class="vgrid" data-cols="${tgts.length}">${blocks}</div>
    <p class="note">The band is the middle half of realised sales. A quarter land above it
      and a quarter below, so read it as a working range, not a forecast.</p>
  </section>`);
}

// StockX's own headline figures are all-in prices, cross-region sales and
// their duty included, and it publishes no domestic variant. So under the
// default filter the sale rows are computed from the recorded sales instead,
// and two of them change shape: the 90-day average becomes an average of what
// is on record, and volatility gives way to the plain sold range.
function sxRows(){
  const own = XREGION === "domestic";
  const priceRow = (label, pick) => ({label, cell: t => {
    const v = pick(t);
    return {v: usd(v), sub: pctOver(v, t.retail), cls: cls(v, t.retail)};}});
  return [
    priceRow("Last sale", t => {
      if(own){ const pool = stockxPool(t.key); return pool.length ? pool[pool.length - 1].price : null; }
      // StockX shows a region-adjusted last sale; the JSON figure is global.
      const s = latestStockx(t.key); return s.last_sale_local ?? s.last_sale;
    }),
    priceRow("Lowest ask", t => latestStockx(t.key).lowest_ask),
    priceRow("Highest bid", t => latestStockx(t.key).highest_bid),
    own
      ? priceRow('Avg sale <span class="muted">domestic</span>', t => {
          const ps = stockxPool(t.key).map(r => r.price);
          return ps.length ? ps.reduce((a, b) => a + b, 0) / ps.length : null;
        })
      : priceRow('Avg sale <span class="muted">90d</span>', t => latestStockx(t.key).avg_sale_price),
    own
      ? {label: "Sold range", cell: t => {
          const ps = stockxPool(t.key).map(r => r.price);
          return {v: ps.length ? usd(Math.min(...ps)) + "–" + usd(Math.max(...ps)) : "—",
                  sub: ps.length + " sale" + (ps.length === 1 ? "" : "s"), cls: "muted"};}}
      : {label: "Volatility", cell: t => {
          const s = latestStockx(t.key);
          return {v: s.volatility != null ? s.volatility + "%" : "—",
                  sub: s.sale_low != null ? usd(s.sale_low) + "–" + usd(s.sale_high) : "—",
                  cls: "muted"};}},
    {label: 'Sales <span class="muted">90d</span>', cell: t => {
      const s = latestStockx(t.key);
      return {v: s.sales_count_90d ?? "—",
              sub: s.sales_72h != null ? s.sales_72h + " in 72h" : "—", cls: "muted"};}},
  ];
}

const EB_ROWS = [
  {label: "Median sold", cell: t => {
    const m = median(rows(t.key, "sale").map(r => r.price));
    return {v: usd(m), sub: pctOver(m, t.retail), cls: cls(m, t.retail)};}},
  {label: "Sold range", cell: t => {
    const s = rows(t.key, "sale").map(r => r.price);
    return {v: s.length ? usd(Math.min(...s)) + "–" + usd(Math.max(...s)) : "—",
            sub: s.length + " comp" + (s.length === 1 ? "" : "s"), cls: "muted"};}},
  {label: "Lowest ask", cell: t => {
    const a = rows(t.key, "ask").map(r => r.price);
    const v = a.length ? Math.min(...a) : null;
    return {v: usd(v), sub: pctOver(v, t.retail), cls: cls(v, t.retail)};}},
  {label: "Median ask", cell: t => {
    const a = rows(t.key, "ask").map(r => r.price);
    return {v: usd(median(a)), sub: a.length + " listed", cls: "muted"};}},
];

// One column per colorway on show. With both, the over-retail figure rides
// alongside the price as a suffix so the two colorways sit side by side and
// compare on one line; with one, it gets the column back to itself.
function refTable(venue, defs, tgts){
  const solo = tgts.length === 1;
  const head = solo
    ? `<th>${venue}</th><th>Price</th><th>Over retail</th>`
    : `<th>${venue}</th>` + tgts.map(t =>
        `<th class="th-${t.key}">${esc(t.label)}</th>`).join("");
  const body = defs.map(d => {
    const cells = tgts.map(t => {
      const c = d.cell(t);
      return solo
        ? `<td>${c.v}</td><td class="${c.cls}">${c.sub}</td>`
        : `<td>${c.v}<span class="sub ${c.cls}">${c.sub}</span></td>`;
    }).join("");
    return `<tr><td>${d.label}</td>${cells}</tr>`;
  }).join("");
  return `<table>
    <colgroup><col class="c-metric"><col class="c-price"><col class="c-delta"></colgroup>
    <thead><tr>${head}</tr></thead>
    <tbody>${body}</tbody>
  </table>`;
}

function refCard(tgts){
  const sx = refTable("StockX", sxRows(), tgts);
  const eb = refTable("eBay", EB_ROWS, tgts);
  // Filtered to one colorway there is room to stand the two venues side by
  // side; with both, each table already spends its width on the comparison.
  const inner = tgts.length === 1
    ? `<div class="pair" data-cols="2">
         <div class="tablewrap">${sx}</div><div class="tablewrap">${eb}</div>
       </div>`
    : `<div class="tablewrap">${sx}${eb}</div>`;
  return $(`<section class="label">
    <h3 class="cardhead">Market reference</h3>${inner}</section>`);
}

function planBlock(t){
  const s = sellPlan(t);
  if(!s) return "";
  return `<div>
    <div class="vhead"><span class="swatch ${t.key}"></span><b>${esc(t.label)}</b>
      <span>${s.listed} listed · ${s.rate.toFixed(1)}/day</span></div>
    <div class="tablewrap"><table>
      <colgroup><col class="c-ask"><col class="c-sell"><col class="c-profit"></colgroup>
      <thead><tr><th>Ask</th><th>Sells in</th><th>Profit</th></tr></thead>
      <tbody>${s.rows.map(r => `
        <tr class="${s.pick && r.price === s.pick.price ? "pick" : ""}">
          <td>${usd(r.price)}</td>
          <td>${!isFinite(r.days) ? "no buyers that high"
                : r.days > 90 ? "months"
                : r.days < 1 ? "~1 day" : "~" + Math.ceil(r.days) + " days"}
            <span class="muted qpos">${Math.round(r.share * 100)}% of buyers,
              ${r.competing} listing${r.competing === 1 ? "" : "s"}</span></td>
          <td class="${r.profit >= 0 ? "up" : "down"}">${signed(r.profit)}</td>
        </tr>`).join("")}
      </tbody>
    </table></div>
    ${s.pick ? `<p class="note">Most you can ask and still expect to clear inside
      ${HORIZON} days: <b>${usd(s.pick.price)}</b>, for <b>${signed(s.pick.profit)}</b>.</p>`
      : `<p class="note">Nothing on this ladder clears inside ${HORIZON} days at the
      current rate.</p>`}
    ${(HORIZON > 21 && s.decay != null && s.decay < -0.2) ? `<p class="note">Demand is down
      <b>${Math.round(-s.decay * 100)}%</b> since the drop. Every row above assumes today's
      clip holds for the whole ${HORIZON} days, which it very likely will not, so read the
      slow rows as a best case.</p>` : ""}
  </div>`;
}

function planCard(tgts){
  const blocks = tgts.map(planBlock).filter(Boolean);
  if(!blocks.length) return null;
  return $(`<section class="label plan">
    <h3 class="cardhead">What to ask on eBay</h3>
    <p class="note" style="margin:0 0 14px">Ask more and you keep more, but fewer buyers go
      that high and more listings sit under you. Each column counts the in-hand listings
      live now against the rate eBay is currently clearing.</p>
    <div class="pair" data-cols="${blocks.length}">${blocks.join("")}</div>
    <p class="note foot">These are estimates, not forecasts. Condition, photos, feedback
      and shipping all pull buyers out of price order, past sales only approximate what
      buyers will pay next, and the clip is still falling, so later days will run slower

  </section>`);
}

/* ---- charts ---------------------------------------------------------- */

// Each chart leaves its scales and its hit targets here after drawing so the
// hover layer can find what is under the pointer without knowing how the
// chart was built.
const CHART = {};
const AXIS_INK = "#6B6560", GRID_INK = "rgba(20,17,15,.09)";
const AXIS_FONT = "9px ui-monospace, Menlo, monospace";

function chartFrame(id){
  return `<div class="chartwrap">
    <canvas id="${id}"></canvas>
    <div class="tip" role="status" hidden></div>
  </div>`;
}

function historyCard(){
  const swatches = activeTargets().map(t =>
    `<span><i class="dot" style="background:${stroke(t.key)}"></i>${esc(t.label)}</span>`).join("");
  return $(`<section class="label w7">
    <h3 class="cardhead">Price history — sale prices by date</h3>
    ${chartFrame("chart")}
    <div class="legend">
      ${swatches}
      <span><i style="width:15px;border-top:2px solid var(--ink-soft)"></i>StockX</span>
      <span><i style="width:15px;border-top:2px dashed var(--ink-soft)"></i>eBay</span>
      <span id="retail-legend" hidden><i class="dot"
        style="background:var(--ink-soft);opacity:.45"></i>retail line</span>
    </div>
  </section>`);
}

function spreadCard(){
  return $(`<section class="label w5">
    <h3 class="cardhead">StockX bid–ask spread</h3>
    ${chartFrame("spread")}
    <p class="note">Highest bid to lowest ask. Narrowing means a sale is likelier to
      clear; widening means the book is drifting apart. No source keeps this series —
      it exists only because we poll for it.</p>
  </section>`);
}

function canvasContext(cv){
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight || 184;
  cv.width = w * dpr; cv.height = h * dpr;
  const g = cv.getContext("2d");
  g.scale(dpr, dpr);
  g.clearRect(0, 0, w, h);
  return {g, w, h};
}

// Round-dollar gridlines, three to five of them, wherever the scale lands.
function niceTicks(y0, y1){
  const span = y1 - y0;
  const step = [10, 20, 25, 50, 100, 200, 250, 500, 1000].find(s => span / s <= 5) || 1000;
  const out = [];
  for(let v = Math.ceil(y0 / step) * step; v <= y1; v += step) out.push(v);
  return out;
}

function drawAxes(g, w, h, pad, Y, y0, y1, xLabels){
  g.font = AXIS_FONT;
  g.textAlign = "right";
  for(const val of niceTicks(y0, y1)){
    const y = Y(val);
    g.strokeStyle = GRID_INK; g.lineWidth = 1;
    g.beginPath(); g.moveTo(pad.l, y); g.lineTo(w - pad.r, y); g.stroke();
    g.fillStyle = AXIS_INK; g.fillText(usd(val), pad.l - 7, y + 3);
  }
  g.fillStyle = AXIS_INK;
  for(const [text, align] of xLabels){
    g.textAlign = align;
    g.fillText(text, align === "left" ? pad.l : w - pad.r, h - 7);
  }
}

function emptyChart(g, pad, h, msg){
  g.fillStyle = AXIS_INK;
  g.font = "12px ui-monospace, Menlo, monospace";
  g.textAlign = "left";
  g.fillText(msg, pad.l, h / 2);
}

const fmtDay = (ms) => new Date(ms).toLocaleDateString("en-US",
  {month: "short", day: "numeric", timeZone: "UTC"});
const fmtStamp = (ms) => new Date(ms).toLocaleString("en-US",
  {month: "short", day: "numeric", hour: "numeric", minute: "2-digit"});

function drawSpread(){
  const cv = document.getElementById("spread");
  if(!cv) return;
  const {g, w, h} = canvasContext(cv);

  const series = {};
  let all = [];
  for(const t of activeTargets()){
    const pts = (DATA.stockx[t.key] || [])
      .filter(s => s.lowest_ask != null && s.highest_bid != null)
      .map(s => ({x: Date.parse(s.t), ask: s.lowest_ask, bid: s.highest_bid, key: t.key,
                  label: t.label}));
    if(pts.length) series[t.key] = pts;
    all = all.concat(pts);
  }
  const pad = {l: 46, r: 10, t: 12, b: 22};
  CHART.spread = null;
  if(all.length < 2){
    emptyChart(g, pad, h, "collecting — needs a few more polls");
    return;
  }
  const xs = all.map(p => p.x);
  const ys = all.flatMap(p => [p.ask, p.bid]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const y0 = Math.min(...ys) * 0.98, y1 = Math.max(...ys) * 1.02;
  const X = v => pad.l + (x1 === x0 ? 0.5 : (v - x0) / (x1 - x0)) * (w - pad.l - pad.r);
  const Y = v => pad.t + (1 - (v - y0) / (y1 - y0)) * (h - pad.t - pad.b);

  drawAxes(g, w, h, pad, Y, y0, y1, [[fmtStamp(x0), "left"], [fmtStamp(x1), "right"]]);

  for(const [key, pts] of Object.entries(series)){
    const col = key === "red" ? "209,25,31" : "184,134,11";
    // Shade the spread itself: ask along the top, bid back along the bottom.
    g.beginPath();
    pts.forEach((p, i) => i ? g.lineTo(X(p.x), Y(p.ask)) : g.moveTo(X(p.x), Y(p.ask)));
    for(let i = pts.length - 1; i >= 0; i--) g.lineTo(X(pts[i].x), Y(pts[i].bid));
    g.closePath();
    g.fillStyle = `rgba(${col},.13)`;
    g.fill();
    for(const [field, dash] of [["ask", []], ["bid", [4, 3]]]){
      g.strokeStyle = `rgb(${col})`;
      g.lineWidth = 1.8; g.setLineDash(dash); g.lineJoin = "round";
      g.beginPath();
      pts.forEach((p, i) => i ? g.lineTo(X(p.x), Y(p[field])) : g.moveTo(X(p.x), Y(p[field])));
      g.stroke();
      g.setLineDash([]);
    }
  }
  CHART.spread = {w, h, pad, X, Y, series, redraw: drawSpread};
}

function drawChart(){
  const cv = document.getElementById("chart");
  if(!cv) return;
  const {g, w, h} = canvasContext(cv);

  const tgts = activeTargets();
  const pts = [];
  for(const t of tgts){
    // StockX sales carry their own timestamps and ignore the eBay filter.
    // Cross-region sales are off the chart entirely unless they are counted;
    // counted, they draw like any other sale and only the tooltip names them.
    const sales = DATA.stockx_sales?.[t.key] || [];
    const foreign = new Set(crossRegion(sales).foreign);
    for(const r of sales){
      if(!r.date || (foreign.has(r) && XREGION === "domestic")) continue;
      pts.push({x: Date.parse(r.date), y: r.price, key: t.key, label: t.label,
                src: "stockx", cross: foreign.has(r), paid: r.seller_price});
    }
    for(const r of rows(t.key, "sale")){
      if(r.date) pts.push({x: Date.parse(r.date), y: r.price, key: t.key, label: t.label,
                           src: "ebay", title: r.title, tag: r.tag});
    }
  }
  const pad = {l: 46, r: 10, t: 12, b: 22};
  CHART.chart = null;
  if(pts.length < 2){
    emptyChart(g, pad, h, "collecting — not enough dated comps yet");
    return;
  }
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  // A lone four-figure comp otherwise squashes the whole series into the
  // bottom third, so scale to the bulk and let outliers clip at the edge.
  const sorted = [...ys].sort((a, b) => a - b);
  const q = f => sorted[Math.min(sorted.length - 1, Math.floor(sorted.length * f))];
  const y0 = Math.min(q(0.03), ...tgts.map(t => t.retail)) * 0.97;
  const y1 = q(0.95) * 1.05;
  const X = v => pad.l + (x1 === x0 ? 0.5 : (v - x0) / (x1 - x0)) * (w - pad.l - pad.r);
  const Y = v => pad.t + (1 - (Math.max(y0, Math.min(y1, v)) - y0) / (y1 - y0))
                 * (h - pad.t - pad.b);

  drawAxes(g, w, h, pad, Y, y0, y1, [[fmtDay(x0), "left"], [fmtDay(x1), "right"]]);
  // retail reference lines
  let drewRetail = false;
  for(const t of tgts){
    if(t.retail < y0 || t.retail > y1) continue;
    drewRetail = true;
    g.strokeStyle = "rgba(20,17,15,.3)"; g.setLineDash([3, 3]);
    g.beginPath(); g.moveTo(pad.l, Y(t.retail)); g.lineTo(w - pad.r, Y(t.retail)); g.stroke();
    g.setLineDash([]);
  }
  const rl = document.getElementById("retail-legend");
  if(rl) rl.hidden = !drewRetail;
  // points
  for(const p of pts){
    const col = p.key === "red" ? "209,25,31" : "184,134,11";
    g.beginPath();
    g.arc(X(p.x), Y(p.y), 3, 0, Math.PI * 2);
    if(p.src === "stockx"){ g.fillStyle = `rgba(${col},.55)`; g.fill(); }
    else { g.strokeStyle = `rgba(${col},.5)`; g.lineWidth = 1.2; g.stroke(); }
  }
  // Daily median per colorway per source: StockX solid, eBay dashed.
  const DAY = 864e5;
  for(const t of tgts){
    for(const src of ["stockx", "ebay"]){
      const byDay = {};
      for(const p of pts.filter(p => p.key === t.key && p.src === src)){
        const d = Math.floor(p.x / DAY) * DAY;
        (byDay[d] ||= []).push(p.y);
      }
      const line = Object.keys(byDay).map(Number).sort((a, b) => a - b)
        .map(d => [d, median(byDay[d])]);
      if(line.length < 2) continue;
      g.strokeStyle = stroke(t.key);
      g.lineWidth = src === "stockx" ? 2.2 : 1.5;
      g.setLineDash(src === "stockx" ? [] : [4, 3]);
      g.lineJoin = "round";
      g.beginPath();
      line.forEach(([d, m], i) => i ? g.lineTo(X(d), Y(m)) : g.moveTo(X(d), Y(m)));
      g.stroke();
      g.setLineDash([]);
    }
  }
  CHART.chart = {w, h, pad, X, Y, redraw: drawChart,
                 pts: pts.map(p => ({...p, px: X(p.x), py: Y(p.y)}))};
}

/* ---- hover layer ------------------------------------------------------ */

// The scatter is dense, so the pointer only has to be closest to a point,
// not on it. Beyond this many pixels nothing is picked.
const HIT_RADIUS = 24;

function locateHistory(st, mx, my){
  let best = null, bd = HIT_RADIUS * HIT_RADIUS;
  for(const p of st.pts){
    const d = (p.px - mx) ** 2 + (p.py - my) ** 2;
    if(d < bd){ bd = d; best = p; }
  }
  if(!best) return null;
  return {
    px: best.px, py: best.py,
    head: best.src === "ebay" ? fmtDay(best.x) : fmtStamp(best.x),
    rows: [{value: usd(best.y), color: stroke(best.key),
            label: `${best.label} · ${best.src === "ebay" ? "eBay" : "StockX"}${
              best.tag === "presale" ? " · presale" : best.cross ? " · cross-region" : ""}`}],
    text: best.title || (best.cross ? `Buyer's price with import duty folded in${
      best.paid != null ? `; the seller was paid ${usd(best.paid)}` : ""}.` : ""),
    paint(g){
      hairline(g, st, best.px);
      ring(g, best.px, best.py, stroke(best.key));
    },
  };
}

// The crosshair finds the poll: snap to the nearest sampled timestamp and read
// every colorway's book at that moment.
function locateSpread(st, mx){
  const seriesList = Object.values(st.series);
  const stamps = [...new Set(seriesList.flat().map(p => p.x))];
  let x = null, bd = Infinity;
  for(const s of stamps){
    const d = Math.abs(st.X(s) - mx);
    if(d < bd){ bd = d; x = s; }
  }
  if(x == null) return null;
  const at = seriesList.map(pts =>
    pts.reduce((a, p) => Math.abs(p.x - x) < Math.abs(a.x - x) ? p : a));
  const px = st.X(x);
  return {
    px, py: st.Y(at.reduce((s, p) => s + p.ask, 0) / at.length),
    head: `${fmtStamp(x)} · ask / bid`,
    rows: at.map(p => ({value: `${usd(p.ask)} / ${usd(p.bid)}`, color: stroke(p.key),
                        label: `${p.label} · ${usd(p.ask - p.bid)} spread`})),
    paint(g){
      hairline(g, st, px);
      for(const p of at){
        ring(g, st.X(p.x), st.Y(p.ask), stroke(p.key));
        ring(g, st.X(p.x), st.Y(p.bid), stroke(p.key));
      }
    },
  };
}

function hairline(g, st, px){
  g.strokeStyle = "rgba(20,17,15,.35)"; g.lineWidth = 1; g.setLineDash([2, 3]);
  g.beginPath(); g.moveTo(px, st.pad.t); g.lineTo(px, st.h - st.pad.b); g.stroke();
  g.setLineDash([]);
}

// A surface ring first, so the mark reads on top of whatever it overlaps.
function ring(g, x, y, color){
  g.beginPath(); g.arc(x, y, 6.5, 0, Math.PI * 2);
  g.fillStyle = "#F4F2ED"; g.fill();
  g.beginPath(); g.arc(x, y, 4.5, 0, Math.PI * 2);
  g.fillStyle = color; g.fill();
}

function fillTip(tip, hit){
  tip.replaceChildren();
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if(cls) n.className = cls;
    if(text != null) n.textContent = text;
    return n;
  };
  tip.append(el("div", "tip-h", hit.head));
  for(const r of hit.rows){
    const row = el("div", "tip-r");
    const key = el("i"); key.style.borderColor = r.color;
    row.append(key, el("b", null, r.value), el("span", null, r.label));
    tip.append(row);
  }
  // Listing titles are eBay's text, not ours: textContent only.
  if(hit.text) tip.append(el("div", "tip-t", hit.text));
}

function attachHover(id, locate){
  const cv = document.getElementById(id);
  if(!cv) return;
  const tip = cv.parentElement.querySelector(".tip");
  const hide = () => { tip.hidden = true; if(CHART[id]) CHART[id].redraw(); };
  const move = (ev) => {
    const st = CHART[id];
    if(!st) return;
    const r = cv.getBoundingClientRect();
    const mx = ev.clientX - r.left, my = ev.clientY - r.top;
    const hit = locate(st, mx, my);
    st.redraw();
    if(!hit){ tip.hidden = true; return; }
    hit.paint(cv.getContext("2d"));
    fillTip(tip, hit);
    tip.hidden = false;
    // Beside the mark, on whichever side has room; on a phone neither side
    // may, so it sits above the mark instead (or below, near the top edge).
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let left = hit.px + 14, top = hit.py - th / 2;
    if(left + tw > st.w - 4){
      left = hit.px - 14 - tw;
      if(left < 4){
        left = Math.max(4, Math.min(st.w - tw - 4, hit.px - tw / 2));
        top = hit.py - th - 14 >= 0 ? hit.py - th - 14 : hit.py + 14;
      }
    }
    tip.style.left = left + "px";
    tip.style.top = Math.max(0, Math.min(st.h - th, top)) + "px";
  };
  cv.addEventListener("pointermove", move);
  cv.addEventListener("pointerdown", move);
  // A finger leaves the canvas the moment it lifts, which would take the
  // tooltip with it. Touch readouts stay up until the next tap elsewhere.
  cv.addEventListener("pointerleave", ev => { if(ev.pointerType === "mouse") hide(); });
  document.addEventListener("pointerdown", ev => { if(ev.target !== cv && !tip.hidden) hide(); });
}

// "3h ago" reads faster than a timestamp for the last day; beyond a week the
// date is what matters.
function ago(iso){
  const ms = Date.now() - Date.parse(iso);
  if(!isFinite(ms) || ms < 0) return "—";
  const m = ms / 6e4, h = m / 60, d = h / 24;
  if(m < 60) return Math.max(1, Math.round(m)) + "m ago";
  if(h < 24) return Math.round(h) + "h ago";
  if(d < 7) return Math.round(d) + "d ago";
  return fmtDay(Date.parse(iso));
}

function listingsCard(tgts){
  // An ask is keyed by listing and price, so a seller who changes their price
  // produces a second row. Fold those into one line per listing, newest price
  // shown, and note what it was before.
  const groups = {};
  for(const t of tgts){
    for(const r of rows(t.key, "ask")){
      if(!r.seen) continue;
      (groups[r.url || r.title] ||= []).push({...r, label: t.label, key: t.key, retail: t.retail});
    }
  }
  const all = Object.values(groups).map(g => {
    g.sort((a, b) => a.seen.localeCompare(b.seen));
    const cur = g[g.length - 1], prev = g.length > 1 ? g[g.length - 2].price : null;
    return {...cur, prev: prev != null && prev !== cur.price ? prev : null};
  });
  all.sort((a, b) => b.seen.localeCompare(a.seen) || b.price - a.price);
  const body = all.slice(0, 12).map(r => `<tr>
      <td title="${esc(r.title)}"><span class="swatch ${r.key}"></span>${r.url
        ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a>`
        : esc(r.title)}${r.tag === "presale" ? '<span class="pill presale">presale</span>' : ""}</td>
      <td>${usd(r.price)}<span class="sub ${cls(r.price, r.retail)}">${pctOver(r.price, r.retail)}</span>${
        r.prev != null ? `<span class="sub muted">was ${usd(r.prev)}</span>` : ""}</td>
      <td class="muted">${ago(r.seen)}</td>
    </tr>`).join("");
  return $(`<section class="label listings">
    <h3 class="cardhead">Latest listings — ${all.length} eBay asks</h3>
    <div class="tablewrap"><table>
      <colgroup><col class="c-title"><col class="c-lprice"><col class="c-seen"></colgroup>
      <thead><tr><th>Listing</th><th>Ask</th><th>Seen</th></tr></thead>
      <tbody>${body || '<tr><td colspan="3" class="muted">No listings match this filter.</td></tr>'}</tbody>
    </table></div>
    <p class="note">Newest first, by when the collector first saw the listing at this
      price. A seller who changes their price shows up again with the previous ask noted.</p>
  </section>`);
}

function compsCard(tgts){
  const all = [];
  for(const t of tgts){
    for(const r of rows(t.key, "sale")) all.push({...r, label: t.label, key: t.key});
  }
  all.sort((a, b) => (b.date || "").localeCompare(a.date || "") || b.price - a.price);
  const items = all.slice(0, 15).map(r => `<li>
      <span class="ctitle" title="${esc(r.title)}">${r.url
        ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a>`
        : esc(r.title)}</span>
      <span class="cmeta">${r.tag === "presale" ? '<span class="pill presale">presale</span> ' : ""}<span
        class="cdate">${esc(r.date || "—")}</span>
        <span class="cprice">${usd(r.price)}</span></span>
    </li>`).join("");
  return $(`<section class="label">
    <h3 class="cardhead">Recent sold comps — ${all.length} matching filter</h3>
    <ul class="comps">${items || '<li class="muted">No comps match this filter.</li>'}</ul>
  </section>`);
}

function render(){
  const app = document.getElementById("app");
  const tgts = activeTargets();
  app.innerHTML = "";

  app.append(headCard());
  app.append(verdictCard(tgts));
  app.append(historyCard());
  app.append(spreadCard());
  // The wide card leads each row so the column seam lines up with the charts.
  // With both colorways the plan has two blocks and takes the wide slot; with
  // one, the reference card pairs its two venues side by side and takes it.
  const plan = planCard(tgts), ref = refCard(tgts), solo = tgts.length === 1;
  if(plan){
    plan.classList.add(solo ? "w5" : "w7");
    ref.classList.add(solo ? "w7" : "w5");
  }
  app.append(...(solo ? [ref, plan] : [plan, ref]).filter(Boolean));
  app.append(listingsCard(tgts));
  app.append(compsCard(tgts));

  app.append($(`<p class="footline">
    StockX order book + eBay sold and active listings · collected every 3 hours<br>
    Net figures assume ${Math.round(DATA.fees.stockx * 100)}% StockX and
    ${(DATA.fees.ebay * 100).toFixed(2)}% eBay fees, before shipping
  </p>`));

  drawChart();
  drawSpread();
  attachHover("chart", locateHistory);
  attachHover("spread", locateSpread);
}

render();
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { drawChart(); drawSpread(); }, 120); });
</script>

</body>
</html>

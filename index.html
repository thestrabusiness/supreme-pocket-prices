<body>
<title>Supreme × Analogue Pocket — Market Tracker</title>
<style>
  :root{
    --red:#E01B22; --red-deep:#8E1015;
    --stock:#F4F2ED; --stock-sink:#E9E5DC;
    --ink:#14110F; --ink-soft:#6B6560; --rule:#D8D4CC;
    --gain:#0F7B4F; --loss:#A8121A; --gold:#9C7112;
    --display:'Archivo Black','Arial Black',Impact,'Helvetica Neue',sans-serif;
    --body:'Helvetica Neue',Helvetica,Arial,sans-serif;
    --data:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--red);
    background-image:
      radial-gradient(ellipse at 18% -5%, rgba(255,255,255,.11), transparent 55%),
      radial-gradient(ellipse at 92% 105%, rgba(0,0,0,.22), transparent 52%);
    background-attachment:fixed;
    font-family:var(--body); color:var(--ink);
    -webkit-font-smoothing:antialiased;
    padding:26px 15px 60px;
  }
  .stack{max-width:660px;margin:0 auto;display:flex;flex-direction:column;gap:18px;}

  .label{
    background:var(--stock); border-radius:10px; padding:20px;
    box-shadow:0 1px 0 rgba(255,255,255,.4) inset, 0 7px 20px rgba(0,0,0,.26);
    position:relative;
  }
  .label::after{content:"";position:absolute;inset:0;border-radius:10px;
    box-shadow:0 0 0 1px rgba(0,0,0,.07) inset;pointer-events:none;}

  .brandline{
    font-family:var(--display);
    font-size:clamp(25px,6.8vw,36px); line-height:.95; letter-spacing:-.02em;
    text-transform:uppercase; transform:skewX(-9deg); transform-origin:left bottom;
    margin:0 0 14px; text-wrap:balance;
  }
  .brandline em{font-style:normal;color:var(--red);}

  .barcode{height:38px;width:100%;margin:0 0 11px;background-repeat:repeat-x;
    background-size:66px 100%;
    background-image:repeating-linear-gradient(90deg,
      var(--ink) 0 2px, transparent 2px 5px, var(--ink) 5px 6px, transparent 6px 10px,
      var(--ink) 10px 13px, transparent 13px 14px, var(--ink) 14px 15px, transparent 15px 19px,
      var(--ink) 19px 22px, transparent 22px 25px, var(--ink) 25px 26px, transparent 26px 30px,
      var(--ink) 30px 33px, transparent 33px 34px, var(--ink) 34px 36px, transparent 36px 40px,
      var(--ink) 40px 41px, transparent 41px 45px, var(--ink) 45px 48px, transparent 48px 50px,
      var(--ink) 50px 51px, transparent 51px 55px, var(--ink) 55px 58px, transparent 58px 59px,
      var(--ink) 59px 61px, transparent 61px 66px);}

  .meta{font-family:var(--data);font-size:11px;letter-spacing:.03em;color:var(--ink-soft);
    display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .meta strong{color:var(--ink);font-weight:700;}

  /* filter */
  .filterbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .filterbar h3{font-family:var(--data);font-size:10px;font-weight:400;
    text-transform:uppercase;letter-spacing:.13em;color:var(--ink-soft);margin:0;}
  .seg{display:flex;border:1px solid var(--rule);border-radius:7px;overflow:hidden;}
  .seg button{
    appearance:none;border:0;background:transparent;cursor:pointer;
    font-family:var(--data);font-size:11px;letter-spacing:.04em;
    padding:8px 13px;color:var(--ink-soft);
    border-right:1px solid var(--rule);transition:background .13s,color .13s;
  }
  .seg button:last-child{border-right:0;}
  .seg button:hover{background:var(--stock-sink);color:var(--ink);}
  .seg button[aria-pressed="true"]{background:var(--red);color:#fff;font-weight:700;}
  .seg button:focus-visible{outline:2px solid var(--ink);outline-offset:-2px;}
  .filternote{font-size:12px;color:var(--ink-soft);margin:9px 0 0;line-height:1.5;}

  /* model card */
  .swatchline{display:flex;align-items:center;gap:9px;}
  .swatch{width:14px;height:14px;border-radius:3px;flex:none;
    box-shadow:0 0 0 1px rgba(0,0,0,.2) inset;}
  .swatch.red{background:#D1191F;}
  .swatch.gold{background:linear-gradient(135deg,#E8C25A,#B8860B);}
  .model{font-family:var(--display);font-size:clamp(19px,5vw,25px);
    letter-spacing:-.01em;text-transform:uppercase;margin:0;}
  .retail{font-family:var(--data);font-size:11px;color:var(--ink-soft);
    letter-spacing:.03em;margin:3px 0 15px;}

  .verdict{
    display:flex;justify-content:space-between;align-items:baseline;gap:12px;
    background:var(--stock-sink);border-radius:7px;padding:12px 13px;margin:0 0 15px;
    border-left:3px solid var(--red);flex-wrap:wrap;
  }
  .verdict .vlabel{font-family:var(--data);font-size:10px;text-transform:uppercase;
    letter-spacing:.11em;color:var(--ink-soft);}
  .verdict .vmain{font-family:var(--data);font-size:17px;font-weight:700;
    font-variant-numeric:tabular-nums;}
  .verdict .vsub{font-size:12px;color:var(--ink-soft);width:100%;line-height:1.5;}

  .tablewrap{overflow-x:auto;}
  /* Fixed layout so the StockX and eBay tables share identical column widths.
     Left to auto-size, each sizes to its own labels and the price columns
     drift out of alignment between the two. */
  table{width:100%;border-collapse:collapse;table-layout:fixed;}
  col.c-metric{width:38%;}
  col.c-price{width:31%;}
  col.c-delta{width:31%;}
  table + table{margin-top:22px;}
  thead th:first-child{color:var(--ink);font-weight:700;}
  th{font-family:var(--data);font-size:10px;font-weight:400;text-transform:uppercase;
    letter-spacing:.1em;color:var(--ink-soft);text-align:right;padding:0 0 6px;
    border-bottom:1px solid var(--rule);white-space:nowrap;}
  th:first-child{text-align:left;}
  td{padding:9px 0;border-bottom:1px solid var(--rule);font-family:var(--data);
    font-size:13px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
  td:first-child{text-align:left;font-family:var(--body);font-size:13px;font-weight:600;
    white-space:normal;}
  tr:last-child td{border-bottom:none;}
  .up{color:var(--gain);font-weight:700;}
  .down{color:var(--loss);font-weight:700;}
  .muted{color:var(--ink-soft);}
  .pill{display:inline-block;font-family:var(--data);font-size:9px;
    text-transform:uppercase;letter-spacing:.08em;padding:2px 6px;border-radius:3px;
    background:var(--stock-sink);color:var(--ink-soft);margin-left:6px;vertical-align:1px;}
  .pill.presale{background:rgba(156,113,18,.15);color:var(--gold);}

  canvas{width:100%;height:184px;display:block;margin:4px 0 0;}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--data);font-size:10px;
    color:var(--ink-soft);letter-spacing:.04em;margin:9px 0 0;}
  .legend span{display:flex;align-items:center;gap:5px;}
  .dot{width:8px;height:8px;border-radius:50%;}

  .comps{list-style:none;margin:0;padding:0;}
  .comps li{display:flex;justify-content:space-between;gap:12px;align-items:baseline;
    padding:8px 0;border-bottom:1px solid var(--rule);font-size:13px;}
  .comps li:last-child{border-bottom:none;}
  .comps a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--rule);}
  .comps a:hover{border-bottom-color:var(--ink);}
  .comps .cprice{font-family:var(--data);font-weight:700;font-variant-numeric:tabular-nums;
    white-space:nowrap;}
  .comps .cdate{font-family:var(--data);font-size:10px;color:var(--ink-soft);
    white-space:nowrap;}

  .health{font-family:var(--data);font-size:10.5px;line-height:1.7;color:var(--ink-soft);}
  .health b{color:var(--ink);}
  .ok{color:var(--gain);} .bad{color:var(--loss);}

  .footline{font-family:var(--data);font-size:10px;letter-spacing:.05em;
    color:rgba(255,255,255,.75);text-align:center;line-height:1.75;padding:2px 8px 0;}

  @media (prefers-reduced-motion:no-preference){
    .label{animation:settle .45s cubic-bezier(.2,.8,.3,1) backwards;}
    .label:nth-child(2){animation-delay:.05s;} .label:nth-child(3){animation-delay:.1s;}
    .label:nth-child(4){animation-delay:.15s;} .label:nth-child(5){animation-delay:.2s;}
    .label:nth-child(6){animation-delay:.25s;}
    @keyframes settle{from{opacity:0;transform:translateY(8px);}}
  }
</style>

function median(xs){
  if(!xs.length) return null;
  const s = [...xs].sort((a,b)=>a-b), m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m-1] + s[m]) / 2;
}
function pctOver(price, retail){
  if(price == null) return "—";
  const p = Math.round((price / retail - 1) * 100);
  return (p >= 0 ? "+" : "") + p + "%";
}
function cls(price, retail){
  if(price == null) return "muted";
  return price >= retail ? "up" : "down";
}
function rows(key, kind){
  return DATA.ebay[key].filter(r =>
    r.kind === kind && (FILTER === "all" || r.tag === FILTER));
}
function latestStockx(key){
  const s = DATA.stockx[key];
  return s.length ? s[s.length - 1] : {};
}

function verdictFor(t){
  const sx = latestStockx(t.key);
  const sxNet = sx.highest_bid ? sx.highest_bid * (1 - DATA.fees.stockx) : null;
  const eb = median(rows(t.key, "sale").map(r => r.price));
  const ebNet = eb ? eb * (1 - DATA.fees.ebay) : null;
  let best = null, other = null, bestName = "", otherName = "";
  if(sxNet != null && ebNet != null){
    if(ebNet >= sxNet){ best = ebNet; bestName = "eBay"; other = sxNet; otherName = "StockX"; }
    else { best = sxNet; bestName = "StockX"; other = ebNet; otherName = "eBay"; }
  }
  return {sx, sxNet, eb, ebNet, best, other, bestName, otherName};
}

function drawSpread(){
  const cv = document.getElementById("spread");
  if(!cv) return;
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = 184;
  cv.width = w * dpr; cv.height = h * dpr;
  const g = cv.getContext("2d");
  g.scale(dpr, dpr);
  g.clearRect(0, 0, w, h);

  const series = {};
  let all = [];
  for(const t of DATA.targets){
    const pts = (DATA.stockx[t.key] || [])
      .filter(s => s.lowest_ask != null && s.highest_bid != null)
      .map(s => ({x: Date.parse(s.t), ask: s.lowest_ask, bid: s.highest_bid}));
    if(pts.length) series[t.key] = pts;
    all = all.concat(pts);
  }
  const pad = {l: 46, r: 10, t: 12, b: 22};
  if(all.length < 2){
    g.fillStyle = "#6B6560";
    g.font = "12px ui-monospace, Menlo, monospace";
    g.fillText("collecting — needs a few more polls", pad.l, h / 2);
    return;
  }
  const xs = all.map(p => p.x);
  const ys = all.flatMap(p => [p.ask, p.bid]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const y0 = Math.min(...ys) * 0.98, y1 = Math.max(...ys) * 1.02;
  const X = v => pad.l + (x1 === x0 ? 0.5 : (v - x0) / (x1 - x0)) * (w - pad.l - pad.r);
  const Y = v => pad.t + (1 - (v - y0) / (y1 - y0)) * (h - pad.t - pad.b);

  g.font = "9px ui-monospace, Menlo, monospace";
  g.textAlign = "right";
  for(let i = 0; i <= 3; i++){
    const val = y0 + (y1 - y0) * i / 3, y = Y(val);
    g.strokeStyle = "rgba(20,17,15,.09)"; g.lineWidth = 1;
    g.beginPath(); g.moveTo(pad.l, y); g.lineTo(w - pad.r, y); g.stroke();
    g.fillStyle = "#6B6560"; g.fillText("$" + Math.round(val), pad.l - 7, y + 3);
  }
  g.fillStyle = "#6B6560";
  [[x0, "left"], [x1, "right"]].forEach(([v, align]) => {
    g.textAlign = align;
    g.fillText(new Date(v).toLocaleString("en-US", {month: "short", day: "numeric",
      hour: "numeric"}), align === "left" ? pad.l : w - pad.r, h - 7);
  });

  for(const [key, pts] of Object.entries(series)){
    const col = key === "red" ? "209,25,31" : "184,134,11";
    // Shade the spread itself: ask along the top, bid back along the bottom.
    g.beginPath();
    pts.forEach((p, i) => i ? g.lineTo(X(p.x), Y(p.ask)) : g.moveTo(X(p.x), Y(p.ask)));
    for(let i = pts.length - 1; i >= 0; i--) g.lineTo(X(pts[i].x), Y(pts[i].bid));
    g.closePath();
    g.fillStyle = `rgba(${col},.13)`;
    g.fill();
    for(const [field, dash] of [["ask", []], ["bid", [4, 3]]]){
      g.strokeStyle = `rgb(${col})`;
      g.lineWidth = 1.8; g.setLineDash(dash); g.lineJoin = "round";
      g.beginPath();
      pts.forEach((p, i) => i ? g.lineTo(X(p.x), Y(p[field])) : g.moveTo(X(p.x), Y(p[field])));
      g.stroke();
      g.setLineDash([]);
    }
  }
}

  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  // A lone four-figure comp otherwise squashes the whole series into the
  // bottom third, so scale to the bulk and let outliers clip at the edge.
  const sorted = [...ys].sort((a, b) => a - b);
  const q = f => sorted[Math.min(sorted.length - 1, Math.floor(sorted.length * f))];
  const y0 = Math.min(q(0.03), ...DATA.targets.map(t => t.retail)) * 0.97;
  const y1 = q(0.95) * 1.05;
  const X = v => pad.l + (x1 === x0 ? 0.5 : (v - x0) / (x1 - x0)) * (w - pad.l - pad.r);
  const Y = v => pad.t + (1 - (Math.max(y0, Math.min(y1, v)) - y0) / (y1 - y0))
                 * (h - pad.t - pad.b);

  // horizontal grid + price axis
  g.font = "9px ui-monospace, Menlo, monospace";
  g.textAlign = "right";
  for(let i = 0; i <= 3; i++){
    const val = y0 + (y1 - y0) * i / 3, y = Y(val);
    g.strokeStyle = "rgba(20,17,15,.09)"; g.lineWidth = 1;
    g.beginPath(); g.moveTo(pad.l, y); g.lineTo(w - pad.r, y); g.stroke();
    g.fillStyle = "#6B6560";
    g.fillText("$" + Math.round(val), pad.l - 7, y + 3);
  }
  // retail reference lines
  let drewRetail = false;
  for(const t of DATA.targets){
    if(t.retail < y0 || t.retail > y1) continue;
    drewRetail = true;
    g.strokeStyle = "rgba(20,17,15,.3)"; g.setLineDash([3, 3]);
    g.beginPath(); g.moveTo(pad.l, Y(t.retail)); g.lineTo(w - pad.r, Y(t.retail)); g.stroke();
    g.setLineDash([]);
  }
  const rl = document.getElementById("retail-legend");
  if(rl) rl.hidden = !drewRetail;
  // date axis
  g.fillStyle = "#6B6560";
  [[x0, "left"], [x1, "right"]].forEach(([v, align]) => {
    g.textAlign = align;
    const d = new Date(v);
    g.fillText(d.toLocaleDateString("en-US", {month: "short", day: "numeric", timeZone: "UTC"}),
      align === "left" ? pad.l : w - pad.r, h - 7);
  });
  // points
  for(const p of pts){
    const col = p.key === "red" ? "209,25,31" : "184,134,11";
    g.beginPath();
    g.arc(X(p.x), Y(p.y), 3, 0, Math.PI * 2);
    if(p.src === "stockx"){ g.fillStyle = `rgba(${col},.55)`; g.fill(); }
    else { g.strokeStyle = `rgba(${col},.5)`; g.lineWidth = 1.2; g.stroke(); }
  }
  // Daily median per colorway per source: StockX solid, eBay dashed.
  const DAY = 864e5;
  for(const t of DATA.targets){
    for(const src of ["stockx", "ebay"]){
      const byDay = {};
      for(const p of pts.filter(p => p.key === t.key && p.src === src)){
        const d = Math.floor(p.x / DAY) * DAY;
        (byDay[d] ||= []).push(p.y);
      }
      const line = Object.keys(byDay).map(Number).sort((a, b) => a - b)
        .map(d => [d, median(byDay[d])]);
      if(line.length < 2) continue;
      g.strokeStyle = t.key === "red" ? "#D1191F" : "#B8860B";
      g.lineWidth = src === "stockx" ? 2.2 : 1.5;
      g.setLineDash(src === "stockx" ? [] : [4, 3]);
      g.lineJoin = "round";
      g.beginPath();
      line.forEach(([d, m], i) => i ? g.lineTo(X(d), Y(m)) : g.moveTo(X(d), Y(m)));
      g.stroke();
      g.setLineDash([]);
    }
  }
}

function compsCard(){
  const all = [];
  for(const t of DATA.targets){
    for(const r of rows(t.key, "sale")) all.push({...r, label: t.label, key: t.key});
  }
  all.sort((a, b) => (b.date || "").localeCompare(a.date || "") || b.price - a.price);
  const items = all.slice(0, 14).map(r => `<li>
      <span>${r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a>`
                     : esc(r.title)}
        ${r.tag === "presale" ? '<span class="pill presale">presale</span>' : ""}</span>
      <span><span class="cdate">${esc(r.date || "—")}</span>
        <span class="cprice">${usd(r.price)}</span></span>
    </li>`).join("");
  return $(`<section class="label">
    <h3 style="font-family:var(--data);font-size:10px;font-weight:400;
      text-transform:uppercase;letter-spacing:.12em;color:var(--ink-soft);margin:0 0 4px;">
      Recent sold comps — ${all.length} matching filter</h3>
    <ul class="comps">${items || '<li class="muted">No comps match this filter.</li>'}</ul>
  </section>`);
}

function render(){
  const app = document.getElementById("app");
  app.innerHTML = "";
  const gen = new Date(DATA.generated_at);
  const stamp = gen.toLocaleString("en-US",
    {month: "short", day: "numeric", hour: "numeric", minute: "2-digit"});
  const totalSold = DATA.targets.reduce((a, t) =>
    a + DATA.ebay[t.key].filter(r => r.kind === "sale").length, 0);

  app.append($(`<section class="label">
    <h1 class="brandline">Supreme<em>®</em><br>Analogue Pocket</h1>
    <div class="barcode" role="presentation"></div>
    <div class="meta">
      <span>DROP <strong>20 AUG 2026</strong></span>
      <span>UPDATED <strong>${esc(stamp)}</strong></span>
      <span><strong>${totalSold}</strong> eBay comps</span>
    </div>
  </section>`));

  const bar = $(`<section class="label">
    <div class="filterbar">
      <h3>Listing type</h3>
      <div class="seg" role="group" aria-label="Filter eBay listings by type">
        <button data-f="all">All</button>
        <button data-f="in_hand">In hand</button>
        <button data-f="presale">Presale</button>
      </div>
    </div>
    <p class="filternote">Presale listings sell an order confirmation, not a console in
      hand, and they clear at different prices. Filter to <b>in hand</b> to compare
      against what you're actually holding. StockX figures are unaffected.</p>
  </section>`);
  bar.querySelectorAll("button").forEach(b => {
    b.setAttribute("aria-pressed", String(b.dataset.f === FILTER));
    b.addEventListener("click", () => { FILTER = b.dataset.f; render(); });
  });
  app.append(bar);

  for(const t of DATA.targets) app.append(modelCard(t));
  app.append(chartCard());
  app.append(spreadCard());
  app.append(compsCard());

  const bad = DATA.runs.filter(r => r.status !== "ok");
  app.append($(`<section class="label">
    <div class="health">
      <b>Collector health</b><br>
      Last ${DATA.runs.length} jobs ·
      <span class="${bad.length ? "bad" : "ok"}">${DATA.runs.length - bad.length} ok,
        ${bad.length} failed</span><br>
      ${bad.length ? bad.slice(0, 3).map(r =>
        `${esc(r.source)}: ${esc(r.detail.split("\n")[0].slice(0, 90))}`).join("<br>")
        : "All sources reporting."}
    </div>
  </section>`));

  app.append($(`<p class="footline">
    StockX order book + eBay sold and active listings · collected every 3 hours<br>
    Net figures assume ${Math.round(DATA.fees.stockx * 100)}% StockX and
    ${(DATA.fees.ebay * 100).toFixed(2)}% eBay fees, before shipping
  </p>`));

  drawChart();
  drawSpread();
}

render();
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { drawChart(); drawSpread(); }, 120); });
</script>
